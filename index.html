<!doctype html>
<html lang="zh-CN">
<head>

<title>ASTRA · 光的形状</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101824;color:#eef5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}canvas:active{cursor:grabbing}
canvas:focus-visible{outline:2px solid #9de5ff;outline-offset:-3px}
header{position:fixed;top:32px;left:36px;pointer-events:none;text-shadow:0 2px 18px #0008}
.eyebrow{font:11px ui-monospace,monospace;letter-spacing:4px;color:#a7c5d8}
h1{font-size:clamp(32px,5vw,58px);letter-spacing:.18em;font-weight:300;margin:12px 0 6px}
header p{font-size:12px;letter-spacing:.12em;color:#b6cbd8;margin:0}
.spectrum{height:2px;width:154px;margin-top:20px;background:linear-gradient(90deg,#fc646a,#ffc56a,#c4ed8b,#6de0e8,#809fff,#c09cff)}
.tag{position:fixed;top:34px;right:32px;border:1px solid #a5c9ef33;padding:9px 12px;border-radius:30px;color:#c6dbe8;font:10px ui-monospace,monospace;letter-spacing:2px;pointer-events:none}
footer{position:fixed;bottom:28px;left:36px;font-size:11px;color:#bbccd8;line-height:1.9;pointer-events:none;text-shadow:0 1px 8px #000}
footer strong{font-weight:500;color:#f0f7ff;letter-spacing:2px}
#panel{position:fixed;right:24px;bottom:24px;width:224px;padding:17px 18px;border:1px solid #bddbff24;border-radius:14px;background:#0b1721c9;backdrop-filter:blur(12px);font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;margin:7px 0;color:#9bb6c8}.row b{color:#e4f4ff;font:12px ui-monospace,monospace}
.live{color:#8fe0bb;font:10px ui-monospace,monospace;letter-spacing:1.7px;margin-bottom:12px}
.live:before{content:"";display:inline-block;width:6px;height:6px;background:#8fe0bb;border-radius:50%;margin-right:8px}
button{border:1px solid #a9d1e633;background:#d8f0ff0b;border-radius:6px;padding:7px 9px;color:#def1fc;font:inherit;cursor:pointer}
button:hover{background:#d8f0ff1c}button:focus-visible{outline:2px solid #9de5ff;outline-offset:2px}

#error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:90vw;width:540px;padding:24px;background:#152330f2;border:1px solid #e5b491;border-radius:12px;white-space:pre-wrap;line-height:1.7}

@media(max-width:600px){header{top:22px;left:22px}.tag{display:none}header p{font-size:10px}

#panel{right:14px;bottom:14px;width:190px;padding:12px}h1{margin-top:8px}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="交互式玻璃光学场景。拖拽或方向键环绕，滚轮或加减键缩放，R 重置。"></canvas>
<header><div class="eyebrow">ASTRA / OPTICAL STUDIES</div><h1>光的形状</h1><p>折射之间，光谱显现。</p><div class="spectrum"></div></header>
<div class="tag">WEBGL 2 · SDF RAY MARCHING</div>
<footer><strong>三个形体 · 一束白光</strong><br>拖拽环绕 / 滚轮缩放<br><span class="details">SPHERE · TORUS · TRIANGULAR PRISM</span></footer>
<aside id="panel" aria-label="渲染信息与控制">
<div class="live" id="status">LIVE OPTICS</div>
<div class="row"><span>帧率</span><b id="fps">— FPS</b></div>
<div class="row"><span>原生像素渲染比例</span><b id="scale">—</b></div>
<div class="row"><span>内部尺寸</span><b id="resolution">—</b></div>
<div class="row"><span>设备像素比</span><b id="dpr">—</b></div>
<div class="buttons"><button id="reset" type="button">重置视角</button><button id="beam" type="button" aria-pressed="true">光束：开</button></div>
<p class="note">反射 / 色散 / 菲涅尔 / 软阴影<br>9 波段光束 · 色散适度放大以便观察</p>
</aside>
<div id="error" role="alert" hidden></div>
<noscript><div style="position:fixed;top:45%;left:10%;right:10%">请启用 JavaScript 以运行 WebGL2 光学演示。</div></noscript>
<script id="vertex" type="x-shader/x-vertex">#version 300 es
precision highp float;
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}
</script>
<script id="fragment" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;
uniform vec2 uResolution;
uniform vec3 uEye,uTarget;
uniform float uBeam;
uniform vec3 uA[19],uB[19],uColor[19];
const float EPS=0.0012;
const float FAR=65.0;
const vec3 SUN=vec3(-0.440225,0.880451,0.176090);
// Exact segment distances plus consistent half-space signs form the triangle SDF.
float cross2(vec2 a,vec2 b){return a.x*b.y-a.y*b.x;}
float edgeDistance(vec2 p,vec2 a,vec2 b){
  vec2 e=b-a;
  return length(p-a-e*clamp(dot(p-a,e)/dot(e,e),0.0,1.0));
}
float triangle(vec2 p){
  vec2 a=vec2(-1.05,-0.70),b=vec2(1.05,-0.70),c=vec2(0.0,1.12);
  float d=min(edgeDistance(p,a,b),min(edgeDistance(p,b,c),edgeDistance(p,c,a)));
  bool inside=cross2(b-a,p-a)>=0.0&&cross2(c-b,p-b)>=0.0&&cross2(a-c,p-c)>=0.0;
  return inside?-d:d;
}
float objectSDF(vec3 p,int id){
  if(id==1)return length(p-vec3(-2.45,1.01,0.35))-1.0;
  if(id==2){
    vec3 q=p-vec3(-0.10,1.14,-1.05);
    // A standing torus, gently turned toward the prism.
    q.xz=mat2(0.939373,-0.342898,0.342898,0.939373)*q.xz;
    return length(vec2(length(q.xy)-0.78,q.z))-0.34;
  }
  vec3 q=p-vec3(2.15,0.74,0.35);
  vec2 d=vec2(triangle(q.xy),abs(q.z)-0.70);
  return length(max(d,0.0))+min(max(d.x,d.y),0.0);
}
vec2 sceneSDF(vec3 p){
  vec2 hit=vec2(p.y,0.0);
  for(int i=1;i<=3;i++){float d=objectSDF(p,i);if(d<hit.x)hit=vec2(d,float(i));}
  return hit;
}
vec3 normalAt(vec3 p,int id){
  vec2 e=vec2(0.001,0.0);
  return normalize(vec3(objectSDF(p+e.xyy,id)-objectSDF(p-e.xyy,id),
    objectSDF(p+e.yxy,id)-objectSDF(p-e.yxy,id),
    objectSDF(p+e.yyx,id)-objectSDF(p-e.yyx,id)));
}
vec2 march(vec3 ro,vec3 rd){
  float t=0.0;
  for(int i=0;i<112;i++){
    vec2 h=sceneSDF(ro+rd*t);
    if(h.x<EPS*(1.0+0.025*t))return vec2(t,h.y);
    t+=h.x*0.88;
    if(t>FAR)break;
  }
  return vec2(FAR,-1.0);
}
vec3 sky(vec3 d){
  float h=clamp(d.y,0.0,1.0);
  vec3 c=mix(vec3(0.43,0.58,0.70),vec3(0.055,0.13,0.27),pow(h,0.55));
  float sun=max(dot(d,SUN),0.0);
  c+=vec3(1.0,0.84,0.62)*(0.28*pow(sun,14.0)+3.0*pow(sun,700.0));
  // Broad procedural cloud bands also provide readable glass reflections.
  float clouds=sin(d.x*11.0+d.z*5.0)+sin(d.z*19.0-d.x*3.0)*0.45;
  c+=vec3(0.12)*smoothstep(0.6,1.35,clouds)*smoothstep(0.0,0.25,d.y);
  float strip=exp(-pow((d.x+0.5*d.z-0.2)*8.0,2.0));
  c+=vec3(0.25,0.32,0.40)*strip*smoothstep(0.1,0.5,d.y);
  return c;
}
float shadow(vec3 p){
  float t=0.025,s=1.0;
  for(int i=0;i<36;i++){
    vec3 q=p+SUN*t;
    float d=min(objectSDF(q,1),min(objectSDF(q,2),objectSDF(q,3)));
    s=min(s,9.0*max(d,0.0)/t);
    if(d<0.001||t>13.0)break;
    t+=clamp(d,0.025,0.55);
  }
  return 0.22+0.78*clamp(s,0.0,1.0);
}
float fresnel(float cosine,float ior){
  float f=(ior-1.0)/(ior+1.0);
  return f*f+(1.0-f*f)*pow(1.0-clamp(cosine,0.0,1.0),5.0);
}
vec3 ground(vec3 p,vec3 rd,float distanceToEye,bool detailed){
  vec2 q=p.xz*0.85;
  // Distance-aware analytic filtering avoids undefined derivatives in divergent rays.
  float footprint=clamp(distanceToEye/(uResolution.y*max(abs(rd.y),0.06)),0.002,0.6);
  vec2 s=sin(q*3.141593);
  float check=0.5-0.5*(s.x/sqrt(s.x*s.x+footprint*footprint))*
    (s.y/sqrt(s.y*s.y+footprint*footprint));
  vec3 base=mix(vec3(0.095,0.14,0.18),vec3(0.64,0.69,0.70),check);
  float sh=detailed?shadow(p+vec3(0.0,0.005,0.0)):1.0;
  vec3 c=base*(vec3(0.20,0.26,0.34)+vec3(0.78,0.72,0.60)*sh);
  c=mix(c,sky(reflect(rd,vec3(0,1,0))),0.06+0.15*pow(1.0-abs(rd.y),5.0));
  // Each caustic spot is the actual floor endpoint of a Snell-traced spectral ray.
  for(int i=2;i<19;i+=2){
    vec2 delta=p.xz-uB[i].xz;
    c+=uBeam*uColor[i]*exp(-dot(delta,delta)/0.018)*1.8;
  }
  return mix(c,sky(rd),1.0-exp(-0.009*distanceToEye));
}
vec3 environment(vec3 ro,vec3 rd){
  if(rd.y< -0.0001){
    float t=-ro.y/rd.y;
    if(t>0.0&&t<FAR)return ground(ro+rd*t,rd,t,false);
  }
  return sky(rd);
}
// One secondary SDF hit; deliberately bounded, without recursive shader calls.
vec3 secondary(vec3 ro,vec3 rd){
  vec2 h=march(ro,rd);
  if(h.y<0.0)return sky(rd);
  vec3 p=ro+rd*h.x;
  if(h.y<0.5)return ground(p,rd,h.x,false);
  vec3 n=normalAt(p,int(h.y));
  float f=fresnel(max(dot(-rd,n),0.0),1.5);
  return mix(environment(p+rd*0.02,rd)*vec3(0.91,0.97,0.98),sky(reflect(rd,n)),f);
}
vec3 throughGlass(vec3 p,vec3 incoming,vec3 n,int id,float ior){
  vec3 d=refract(incoming,n,1.0/ior);
  if(dot(d,d)<0.001)return secondary(p+n*0.008,reflect(incoming,n));
  vec3 ro=p+d*0.008;
  float path=0.0,weight=1.0;
  // At most three internal encounters, including total internal reflection.
  for(int bounce=0;bounce<3;bounce++){
    float t=0.0;
    bool found=false;
    for(int i=0;i<64;i++){
      float dist=abs(objectSDF(ro+d*t,id));
      if(dist<EPS){found=true;break;}
      t+=max(dist*0.82,0.0006);
      if(t>9.0)break;
    }
    if(!found)return environment(ro,d)*exp(-0.06*path)*0.5;
    path+=t;
    vec3 q=ro+d*t,outward=normalAt(q,id);
    vec3 outRay=refract(d,-outward,ior);
    if(dot(outRay,outRay)>0.001){
      float f=fresnel(dot(d,outward),ior);
      vec3 absorption=id==1?vec3(0.10,0.035,0.018):vec3(0.018,0.03,0.055);
      return secondary(q+outRay*0.009,normalize(outRay))*exp(-absorption*path)*weight*(1.0-f);
    }
    d=reflect(d,outward);ro=q+d*0.009;weight*=0.96;
  }
  return sky(d)*0.18;
}
// Closest points on the visible camera ray and a finite light segment.
float beamGlow(vec3 ro,vec3 rd,vec3 a,vec3 b,float limit){
  vec3 e=b-a,w=ro-a;
  float ee=dot(e,e);
  if(ee<0.000001)return 0.0;
  float de=dot(rd,e),dw=dot(rd,w),ew=dot(e,w);
  float v=clamp((ew-de*dw)/max(ee-de*de,0.000001),0.0,1.0);
  float t=clamp(de*v-dw,0.0,limit);
  v=clamp((ew+de*t)/ee,0.0,1.0);
  t=clamp(de*v-dw,0.0,limit);
  float d2=dot(ro+rd*t-a-e*v,ro+rd*t-a-e*v);
  float width=0.015+0.0008*t;
  return 0.5*exp(-d2/(width*width))+0.07*exp(-d2/(width*width*9.0));
}
void main(){
  vec2 uv=(2.0*gl_FragCoord.xy-uResolution)/uResolution.y;
  vec3 forward=normalize(uTarget-uEye);
  vec3 right=normalize(cross(forward,vec3(0,1,0)));
  vec3 up=cross(right,forward);
  vec3 rd=normalize(forward*1.95+uv.x*right+uv.y*up);
  vec2 h=march(uEye,rd);
  vec3 color;
  if(h.y<0.0)color=sky(rd);
  else{
    vec3 p=uEye+rd*h.x;
    if(h.y<0.5)color=ground(p,rd,h.x,true);
    else{
      int id=int(h.y);
      vec3 n=normalAt(p,id);
      vec3 reflected=secondary(p+n*0.009,reflect(rd,n));
      // Three independently refracted paths, with larger dispersion in the prism.
      vec3 indices=id==3?vec3(1.48,1.535,1.62):vec3(1.46,1.48,1.51);
      vec3 transmitted=vec3(throughGlass(p,rd,n,id,indices.r).r,
        throughGlass(p,rd,n,id,indices.g).g,throughGlass(p,rd,n,id,indices.b).b);
      vec3 f=vec3(fresnel(dot(-rd,n),indices.r),fresnel(dot(-rd,n),indices.g),
        fresnel(dot(-rd,n),indices.b));
      color=reflected*f+transmitted*(1.0-f);
      color+=vec3(1.0,0.91,0.76)*pow(max(dot(reflect(rd,n),SUN),0.0),240.0)*0.9;
    }
  }
  // Single-scattering visualization, clipped by the opaque floor, not the glass.
  float limit=FAR;
  if(rd.y< -0.0001)limit=min(FAR,max(0.0,-uEye.y/rd.y));
  if(uBeam>0.5)for(int i=0;i<19;i++)color+=uColor[i]*beamGlow(uEye,rd,uA[i],uB[i],limit);
  color=max(color,0.0);
  color=vec3(1.0)-exp(-color*1.25);
  color=pow(color,vec3(1.0/2.2));
  color*=1.0-0.12*smoothstep(0.3,1.7,length(uv));
  fragColor=vec4(color,1.0);
}
</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),error=$('error');
const fail=message=>{error.textContent=message;error.hidden=false;$('status').textContent='RENDERER OFFLINE';};
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){fail('此设备未能创建 WebGL2 上下文。请启用浏览器硬件加速，或使用支持 WebGL2 的浏览器。');return;}
let program,uniforms,vao,raf=0,lost=false;
let yaw=0.10,pitch=0.30,distance=11.8,beam=true,drag=null;
let quality=0.72,actualScale=0.72,last=0,elapsed=0,frames=0,goodWindows=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const add=(a,b)=>a.map((v,i)=>v+b[i]),mul=(a,s)=>a.map(v=>v*s);
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const norm=a=>mul(a,1/Math.hypot(...a));
const refract=(d,n,eta)=>{
  const c=-dot(d,n),k=1-eta*eta*(1-c*c);
  return k<0?null:norm(add(mul(d,eta),mul(n,eta*c-Math.sqrt(k))));
};
// The same triangular cross-section as the fragment SDF; no painted rainbow.
const vertices=[[1.10,0.04,0.35],[3.20,0.04,0.35],[2.15,1.86,0.35]];
function faceHit(ro,rd){
  let nearest=null;
  for(let i=0;i<3;i++){
    const a=vertices[i],b=vertices[(i+1)%3],e=add(b,mul(a,-1));
    const n=norm([e[1],-e[0],0]),den=dot(rd,n);
    if(Math.abs(den)<1e-7)continue;
    const t=dot(add(a,mul(ro,-1)),n)/den;
    if(t<0.0001)continue;
    const p=add(ro,mul(rd,t)),along=dot(add(p,mul(a,-1)),e)/dot(e,e);
    if(along>=-1e-6&&along<=1+1e-6&&(!nearest||t<nearest.t))nearest={p,n,t};
  }
  return nearest;
}
function lightSegments(){
  const A=[],B=[],C=[],put=(a,b,c)=>{A.push(...a);B.push(...b);C.push(...c);};
  const source=[-0.6,0.85,0.35],direction=norm([1,0.22,0]);
  const entry=faceHit(source,direction);
  if(!entry)throw new Error('光束未命中三棱镜');
  put(source,entry.p,[2.0,2.0,2.0]);
  const colors=[[1,.07,.02],[1,.25,.01],[1,.70,.01],[.65,1,.02],[.04,1,.28],
    [.02,.75,1],[.04,.20,1],[.30,.04,1],[.64,.02,1]];
  for(let i=0;i<9;i++){
    const ior=1.48+0.14*i/8,inside=refract(direction,entry.n,1/ior);
    const exit=inside&&faceHit(add(entry.p,mul(inside,0.0005)),inside);
    const outside=exit&&refract(inside,mul(exit.n,-1),ior);
    if(!outside||outside[1]>=0)throw new Error('光谱光路计算失败');
    const floor=add(exit.p,mul(outside,-exit.p[1]/outside[1]));
    put(entry.p,exit.p,mul(colors[i],0.24));
    put(exit.p,floor,mul(colors[i],0.80));
  }
  return {A:new Float32Array(A),B:new Float32Array(B),C:new Float32Array(C)};
}
function compile(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(shader);gl.deleteShader(shader);throw new Error(log||'着色器编译失败');
  }
  return shader;
}
function setup(){
  const vs=compile(gl.VERTEX_SHADER,$('vertex').textContent);
  const fs=compile(gl.FRAGMENT_SHADER,$('fragment').textContent);
  program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);
  gl.deleteShader(vs);gl.deleteShader(fs);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'着色器链接失败');
  gl.useProgram(program);vao=gl.createVertexArray();gl.bindVertexArray(vao);
  uniforms={};
  for(const name of ['uResolution','uEye','uTarget','uBeam','uA[0]','uB[0]','uColor[0]'])
    uniforms[name]=gl.getUniformLocation(program,name);
  const rays=lightSegments();
  gl.uniform3fv(uniforms['uA[0]'],rays.A);gl.uniform3fv(uniforms['uB[0]'],rays.B);
  gl.uniform3fv(uniforms['uColor[0]'],rays.C);
  error.hidden=true;$('status').textContent='LIVE OPTICS';
}
// The scale is relative to native device pixels, including any pixel-budget cap.
let nativeSize=null,observedDpr=0,maxSize=4096;
function resize(){
  const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const w=Math.max(1,nativeSize&&observedDpr===dpr?nativeSize[0]:Math.round(rect.width*dpr));
  const h=Math.max(1,nativeSize&&observedDpr===dpr?nativeSize[1]:Math.round(rect.height*dpr));
  actualScale=Math.min(quality,Math.sqrt(1800000/(w*h)),maxSize/w,maxSize/h);
  const width=Math.max(1,Math.round(w*actualScale)),height=Math.max(1,Math.round(h*actualScale));
  if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
  gl.viewport(0,0,width,height);
  $('scale').textContent=(actualScale*100).toFixed(1)+'%';
  $('resolution').textContent=width+' × '+height;
  $('dpr').textContent=dpr.toFixed(2);
  return rect.width/Math.max(rect.height,1);
}
if('ResizeObserver' in window){
  const observer=new ResizeObserver(entries=>{
    const entry=entries[0],box=entry.devicePixelContentBoxSize;
    nativeSize=box&&box[0]?[box[0].inlineSize,box[0].blockSize]:null;
    observedDpr=window.devicePixelRatio||1;
  });
  try{observer.observe(canvas,{box:'device-pixel-content-box'});}
  catch{observer.observe(canvas);}
}
function clearTiming(){last=0;elapsed=0;frames=0;goodWindows=0;}
function draw(now){
  if(lost||document.hidden){raf=0;return;}
  const aspect=resize();
  // Widen the camera framing on portrait displays without changing the scene.
  const radius=distance*Math.max(1,1.35/Math.max(aspect,0.35));
  const target=[0.25,0.90,0.0],cp=Math.cos(pitch);
  const eye=[target[0]+radius*cp*Math.sin(yaw),target[1]+radius*Math.sin(pitch),radius*cp*Math.cos(yaw)];
  gl.uniform2f(uniforms.uResolution,canvas.width,canvas.height);
  gl.uniform3fv(uniforms.uEye,eye);gl.uniform3fv(uniforms.uTarget,target);
  gl.uniform1f(uniforms.uBeam,beam?1:0);gl.drawArrays(gl.TRIANGLES,0,3);
  if(last){
    elapsed+=Math.max(0.1,now-last);frames++;
    if(elapsed>=1000){
      const fps=1000*frames/elapsed;$('fps').textContent=fps.toFixed(1)+' FPS';
      if(fps<44){quality=Math.max(0.25,Math.min(quality,actualScale)*0.84);goodWindows=0;}
      else if(fps>57){if(++goodWindows>=2){quality=Math.min(1,quality+0.04);goodWindows=0;}}
      else goodWindows=0;
      elapsed=0;frames=0;
    }
  }
  last=now;raf=requestAnimationFrame(draw);
}
function reset(){yaw=0.10;pitch=0.30;distance=11.8;}
$('reset').addEventListener('click',reset);
$('beam').addEventListener('click',()=>{
  beam=!beam;$('beam').textContent=beam?'光束：开':'光束：关';
  $('beam').setAttribute('aria-pressed',String(beam));
});
canvas.addEventListener('pointerdown',e=>{
  if(drag||e.button!==0)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.focus();
});
canvas.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  yaw-=(e.clientX-drag.x)*0.006;pitch=clamp(pitch+(e.clientY-drag.y)*0.005,0.08,1.20);
  drag.x=e.clientX;drag.y=e.clientY;
});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null;};
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,endDrag);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const units=e.deltaMode===1?16:e.deltaMode===2?canvas.clientHeight:1;
  distance=clamp(distance*Math.exp(clamp(e.deltaY*units*0.001,-0.5,0.5)),7,20);
},{passive:false});
canvas.addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','r','R'].includes(e.key))return;
  e.preventDefault();
  if(e.key==='ArrowLeft')yaw-=0.08;if(e.key==='ArrowRight')yaw+=0.08;
  if(e.key==='ArrowUp')pitch=clamp(pitch+0.06,0.08,1.20);
  if(e.key==='ArrowDown')pitch=clamp(pitch-0.06,0.08,1.20);
  if(e.key==='+'||e.key==='=')distance=clamp(distance*0.92,7,20);
  if(e.key==='-')distance=clamp(distance/0.92,7,20);
  if(e.key.toLowerCase()==='r')reset();
});
document.addEventListener('visibilitychange',()=>{
  cancelAnimationFrame(raf);raf=0;clearTiming();
  if(!document.hidden&&!lost)raf=requestAnimationFrame(draw);
});
canvas.addEventListener('webglcontextlost',e=>{
  e.preventDefault();lost=true;cancelAnimationFrame(raf);raf=0;
  fail('图形上下文已暂停，正在等待浏览器恢复…');
});
canvas.addEventListener('webglcontextrestored',()=>{
  try{setup();lost=false;clearTiming();if(!document.hidden)raf=requestAnimationFrame(draw);}
  catch(e){fail('恢复失败：'+e.message);}
});
try{
  setup();maxSize=Math.min(...gl.getParameter(gl.MAX_VIEWPORT_DIMS),gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
  raf=requestAnimationFrame(draw);
}catch(e){lost=true;fail('无法启动光学渲染：\n'+e.message);}
})();
</script>
